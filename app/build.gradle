plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.bewil.besms'
    compileSdk 34

    defaultConfig {
        buildConfigField "String", "COMMIT_HASH", "\"${System.getenv("COMMIT_HASH") ?: "unknown"}\""
        applicationId "com.bewil.besms"
        minSdk 33
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    //implementation libs.work.runtime
}